version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis

  beat:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis

  nginx:
    build: ./docker/nginx
    ports:
      - "80:80"
    volumes:
      - static_volume:/vol/static
    depends_on:
      - web

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: habit_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123159

  redis:
    image: redis:7-alpine

volumes:
  postgres_data:
  static_volume:
